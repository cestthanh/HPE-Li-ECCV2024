dataset_name: wipose
split_to_use: train_test_split

# Optional cache directory containing Train.pt/Test.pt generated by:
# python tools/preprocess_wipose.py --dataset-root <raw_wipose_root> --output-root <cache_root>
# Leave null to read raw .mat files, or set WIPOSE_PREPROCESSED_ROOT to override.
preprocessed_root: null

# WiPose legacy preprocessing multiplied xy by 0.001. Keep this explicit so the
# 3D pipeline can audit whether SkeletonPoints are millimeters or another unit.
pose_scale: 0.001
pose_unit_after_scale: meter
normalize_csi: true

train_dataset:
  split: Train
val_dataset:
  split: Test

train_loader:
  batch_size: 16
  num_workers: 0
  pin_memory: true

val_loader:
  batch_size: 8
  num_workers: 0
  pin_memory: true

test_loader:
  batch_size: 8
  num_workers: 0
  pin_memory: true
